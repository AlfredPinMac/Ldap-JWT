services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: ldap.example.com
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - lab-network

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - openldap
    networks:
      - lab-network

  # 1. LDAP Auth Service (JWT API + TLS Protection) - Protected with Fail2Ban
  ldap-api:
    build: ./fastapi
    container_name: ldap-api-protected
    hostname: ldap-api
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8000:8000"
    environment:
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: "dc=example,dc=com"
      LDAP_USE_TLS: "false"
      JWT_SECRET: "super-secret-jwt-key-for-ldap-cybersecurity-lab-2026"
    depends_on:
      - openldap
    networks:
      - lab-network

  # 2. Pokémon Backend API - Protected with Fail2Ban
  pokemon-backend:
    build: ./pokemon-backend
    container_name: pokemon-backend-protected
    hostname: pokemon-backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "5000:5000"
    environment:
      JWT_SECRET: "super-secret-jwt-key-for-ldap-cybersecurity-lab-2026"
      JWT_ALGORITHM: "HS256"
    depends_on:
      - ldap-api
    networks:
      - lab-network

  # 3. Pokémon Frontend Dashboard (Vue 3 + Nginx) - Protected with Fail2Ban
  pokemon-frontend:
    build: ./pokemon-frontend
    container_name: pokemon-frontend-protected
    hostname: pokemon-frontend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - pokemon-backend
      - ldap-api
    networks:
      - lab-network

volumes:
  ldap_data:
  ldap_config:

networks:
  lab-network:
    driver: bridge
